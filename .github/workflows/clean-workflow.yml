name: Clean Noisy Workflows

on:
  schedule:
    # Run every day at 1 AM Makassar time (17:00 UTC, since Makassar is UTC+8)
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      days_to_keep:
        description: "Keep workflow runs from the last N days"
        required: false
        default: "1"
        type: string
      target_owner:
        description: "Owner of the target repo"
        required: false
        default: "LNSR"
        type: string
      target_repo:
        description: "Name of the target repo"
        required: false
        default: "wplokerbjm-post-automation"
        type: string
      dry_run:
        description: "If 'true', run in dry-run mode and don't delete caches"
        required: false
        default: "false"
        type: string

jobs:
  cleanup-workflows:
    name: Clean up workflow runs and artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: latest
          check-latest: true
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete Old Workflow Runs
        uses: igorjs/gh-actions-clean-workflow@v6
        with:
          owner: ${{ github.event.inputs.target_owner || 'LNSR' }}
          repo: ${{ github.event.inputs.target_repo || 'wplokerbjm-post-automation' }}
          runs_older_than: ${{ github.event.inputs.days_to_keep || '1' }}
          runs_to_keep: 0

      - name: Wipe GitHub Actions cache (daily)
        uses: easimon/wipe-cache@main
        with:
          github-token: ${{ github.token }}
          dry-run: ${{ github.event.inputs.dry_run }}
