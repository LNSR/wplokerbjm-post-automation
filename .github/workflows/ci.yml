name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-python: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run --frozen pytest

      - name: Validate deployment configuration contract
        env:
          WPLBJM_API_BASE_URL_PROD: https://wp.example.test
          WPLBJM_WORDPRESS_DOMAIN: https://wp.example.test
          WPLBJM_JWT_PROD: eyJ0eXAiOiJKV1Qi.e30.signaturevalue
          TELEGRAM_USERNAME: ci_test_user
          TELEGRAM_BOT_TOKEN: 123456789:abcdefghijklmnopqrstuvwxyzABCDE
          TELEGRAM_WEBHOOK_SECRET: ci_webhook_secret_12345
          PUBLIC_BASE_URL: https://bot.example.test
          AI_PROVIDER: opencode
          OPENCODE_API_KEY: ci-opencode-key-123456
          OPENCODE_MODEL_CHAIN: zen:mimo-v2.5-free:chat
          SKILL_MD_PATH: .agents/skills/agent-postdraft/SKILL.md
        run: uv run --frozen agent --check-config

      - name: Compile package
        run: uv run --frozen python -m compileall -q automation

      - name: Check CLI entry point
        run: uv run --frozen agent --help


  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-python: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Sync env vars to Render
        env:
          RENDER_ACCOUNT_API_KEY: ${{ secrets.RENDER_ACCOUNT_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USERNAME: ${{ secrets.TELEGRAM_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WPLBJM_API_BASE_URL_PROD: ${{ secrets.WPLBJM_API_BASE_URL_PROD }}
          WPLBJM_JWT_PROD: ${{ secrets.WPLBJM_JWT_PROD }}
          WP_LOGIN_USERNAME: ${{ secrets.WP_LOGIN_USERNAME }}
          WP_LOGIN_PASSWORD: ${{ secrets.WP_LOGIN_PASSWORD }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GOOGLE_AI_STUDIO_KEY: ${{ secrets.GOOGLE_AI_STUDIO_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          AI_PROVIDER: opencode
          OPENCODE_MODEL_CHAIN: zen:mimo-v2.5-free:chat,go:minimax-m3:messages,go:mimo-v2.5:chat
          ALLOW_DIRECT_IMAGE_FALLBACK: "1"
          EXA_SEARCH_TYPE: auto
          DISABLE_WEB_ENRICHMENT: ""
          SKILL_MD_PATH: .agents/skills/agent-postdraft/SKILL.md
          TELEGRAM_MEDIA_GROUP_DELAY_SECONDS: "2"
          TELEGRAM_BULK_COMMAND_TTL_SECONDS: "90"
          PUBLIC_BASE_URL: ""
          WPLBJM_WORDPRESS_DOMAIN: https://wp.lokerbanjarmasin.my.id
          OPENCODE_VISION_MODE: analyze
        run: uv run --frozen python scripts/sync-render-env.py

      - name: Trigger Render deploy
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_ACCOUNT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}
          wait_deploy: true
          github_deployment: true
          deployment_environment: production
