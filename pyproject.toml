[project]
name = "scrap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.8.0",
    "instaloader>=4.15.1",
    "opencode-vision[paddle]>=2.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "zxing-cpp>=2.3.0",
]

[project.scripts]
agent = "automation.main:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "automation"
module-root = ""
